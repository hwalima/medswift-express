name: Deploy to medswift.express

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js & build assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies & compile assets
        run: |
          npm ci
          npm run build

      - name: Copy built assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          source: "public/build/"
          target: "/home/medswift/public_html/public/"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            set -e
            export PATH="$HOME/bin:$HOME/.local/share/fnm:$PATH"
            eval "$(fnm env --shell bash 2>/dev/null || true)"
            cd /home/medswift/public_html

            echo "── Pulling latest code ──"
            git remote set-url origin https://github.com/hwalima/medswift-express.git
            git pull origin main

            echo "── Installing PHP dependencies ──"
            $HOME/bin/composer install --no-dev --optimize-autoloader --no-interaction

            echo "── Putting app into maintenance mode ──"
            php artisan down --retry=10

            echo "── Running migrations ──"
            php artisan migrate --force

            echo "── Caching config, routes, views ──"
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear
            php artisan view:cache

            echo "── Linking storage ──"
            php artisan storage:link || true

            echo "── Bringing app back online ──"
            php artisan up

            echo "── Deployment complete ──"
